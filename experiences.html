<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Experiences | Szepred</title>

    <meta name="description"
          content="Discover unforgettable travel experiences with Szepred, from adventure and wellness to authentic local experiences.">


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.googleapis.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Nunito:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- =====================================================
         EXPERIENCES CSS
    ====================================================== -->

    <link rel="stylesheet"
          href="experiences.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header id="site-header">

    <div class="logo">

        <a href="index.html">

            <img src="logo.png"
                 alt="Szepred Logo">

        </a>

    </div>


    <nav id="menu">

        <a href="index.html">
            HOME
        </a>

        <a href="experiences.html"
           class="active">
            EXPERIENCES
        </a>

        <a href="packages.html">
            PACKAGES
        </a>

        <a href="gallery.html">
            GALLERY
        </a>

        <a href="about.html">
            ABOUT US
        </a>

        <a href="contact.html">
            CONTACT
        </a>

    </nav>


    <div class="header-icons">

        <i class="fas fa-bars"
           id="menu-btn"
           aria-label="Open menu"
           role="button"
           tabindex="0">
        </i>

    </div>

</header>



<!-- =====================================================
     EXPERIENCES PAGE
===================================================== -->

<main class="experiences-page">


    <!-- =================================================
         PAGE HEADING
    ================================================== -->

    <section class="experiences-heading">

        <div class="experiences-container">

            <span>
                DISCOVER MORE
            </span>


            <h1>
                Find Your
                <em>Experience</em>
            </h1>


            <p>
                Explore unforgettable experiences designed
                around adventure, wellness, adrenaline and
                authentic local culture.
            </p>

        </div>

    </section>



    <!-- =================================================
         EXPERIENCES GRID
    ================================================== -->

    <section class="experiences-section"
             aria-label="Travel experiences">

        <div class="experiences-container">

            <div id="experiencesGrid"
                 class="experiences-grid">

                <!--
                    Cards are loaded from experiences.json
                -->

            </div>


            <div id="experiencesMessage"
                 class="experiences-message"
                 aria-live="polite">
            </div>

        </div>

    </section>


</main>

<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-bottom">
        © 2026 Szepred. All Rights Reserved.
    </div>

</footer>

<!-- =====================================================
     WHATSAPP FLOATING BUTTON
===================================================== -->

<a
    href="https://wa.me/48571993223"
    class="whatsapp-float"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat on WhatsApp"
>
    <i class="fab fa-whatsapp"></i>
</a>




<!-- =====================================================
     EXPERIENCES SCRIPT
===================================================== -->

<script src="experiences.js"></script>


</body>

</html>
