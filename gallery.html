<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore beautiful moments captured during Szepred journeys and experiences."
    >

    <title>Gallery | Szepred</title>


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         GALLERY CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="gallery.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header id="site-header">


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="logo.png"
                    alt="Szepred Logo"
                >

            </a>

        </div>


        <!-- DESKTOP / MOBILE NAVIGATION -->

        <nav id="menu">

            <a href="index.html">
                HOME
            </a>

            <a href="experiences.html">
                EXPERIENCES
            </a>

            <a href="packages.html">
                PACKAGES
            </a>

            <a
                href="gallery.html"
                class="active"
            >
                GALLERY
            </a>

            <a href="about.html">
                ABOUT US
            </a>

            <a href="contact.html">
                CONTACT
            </a>

        </nav>


        <!-- MOBILE MENU BUTTON -->

        <div class="header-icons">

            <button
                type="button"
                id="menu-btn"
                aria-label="Open navigation menu"
                aria-expanded="false"
            >

                <i class="fas fa-bars"></i>

            </button>

        </div>


    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             GALLERY INTRO
        ================================================== -->

        <section class="gallery-intro">

            <div class="gallery-eyebrow">
                SZEPRED JOURNEYS
            </div>


            <h1>
                Memories Along the Way
            </h1>


            <p>
                Beautiful moments captured during the
                journeys and experiences we share with
                our guests.
            </p>

        </section>



        <!-- =================================================
             GALLERY SECTION
        ================================================== -->

        <section
            class="gallery-section"
            aria-label="Szepred photography gallery"
        >


            <!-- GALLERY STATUS -->

            <div
                id="gallery-status"
                class="gallery-status"
                aria-live="polite"
            >
                Loading gallery...
            </div>


            <!--
                JavaScript automatically creates
                the photograph collage here.
            -->

            <div
                id="gallery-grid"
                class="gallery-grid"
            ></div>


        </section>



        <!-- =================================================
             GALLERY LAYOUT CONTROLS
        ================================================== -->


        <!--
            ALIGN PICTURES BUTTON

            Changes the collage into an
            aligned tile/grid view.
        -->

        <button
            type="button"
            id="gallery-layout-button"
            class="gallery-layout-button"
            aria-label="Align pictures"
            title="Align pictures"
        >

            <i class="fas fa-grip"></i>

        </button>


        <!--
            SMALL GLASS LABEL
        -->

        <div
            id="gallery-see-all"
            class="gallery-see-all"
            aria-hidden="true"
        >

            Align pictures

            <span>
                →
            </span>

        </div>


        <!--
            RESTORE COLLAGE BUTTON

            Hidden initially by CSS.
            JavaScript will show it after
            entering aligned view.
        -->

        <button
            type="button"
            id="gallery-restore-button"
            class="gallery-restore-button"
            aria-label="Restore picture layout"
            title="Restore picture layout"
        >

            <i class="fas fa-layer-group"></i>

        </button>


    </main>



    <!-- =====================================================
         LIGHTBOX
    ====================================================== -->

    <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true"
    >


        <!-- CLOSE -->

        <button
            type="button"
            class="lightbox-close"
            id="lightbox-close"
            aria-label="Close image viewer"
        >

            <i class="fas fa-xmark"></i>

        </button>


        <!-- PREVIOUS -->

        <button
            type="button"
            class="lightbox-prev"
            id="lightbox-prev"
            aria-label="Previous image"
        >

            <i class="fas fa-chevron-left"></i>

        </button>


        <!-- LIGHTBOX CONTENT -->

        <div class="lightbox-content">


            <img
                id="lightbox-image"
                class="lightbox-image"
                src=""
                alt="Gallery image"
            >


            <div
                id="lightbox-title"
                class="lightbox-title"
            ></div>


        </div>


        <!-- NEXT -->

        <button
            type="button"
            class="lightbox-next"
            id="lightbox-next"
            aria-label="Next image"
        >

            <i class="fas fa-chevron-right"></i>

        </button>


        <!-- COUNTER -->

        <div
            id="lightbox-counter"
            class="lightbox-counter"
        >
            1 / 1
        </div>


    </div>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        <div class="footer-bottom">

            © 2026 Szepred. All Rights Reserved.

        </div>

    </footer>



    <!-- =====================================================
         WHATSAPP
    ====================================================== -->

    <a
        href="https://wa.me/"
        class="whatsapp-float"
        aria-label="Contact Szepred on WhatsApp"
        target="_blank"
        rel="noopener"
    >

        <i class="fab fa-whatsapp"></i>

    </a>



    <!-- =====================================================
         GALLERY JAVASCRIPT
    ====================================================== -->

    <script
        src="gallery.js"
    ></script>


</body>

</html>
