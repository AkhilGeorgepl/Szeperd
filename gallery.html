<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Explore beautiful moments captured during Szepred journeys and experiences."
    >

    <title>Gallery | Szepred</title>


    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Gallery CSS -->

    <link
        rel="stylesheet"
        href="gallery.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header id="site-header">


        <div class="logo">

            <a href="index.html">

                <img
                    src="logo.png"
                    alt="Szepred Logo"
                >

            </a>

        </div>


        <nav id="menu">

            <a href="index.html">
                HOME
            </a>

            <a href="experiences.html">
                EXPERIENCES
            </a>

            <a href="packages.html">
                PACKAGES
            </a>

            <a
                href="gallery.html"
                class="active"
            >
                GALLERY
            </a>

            <a href="about.html">
                ABOUT US
            </a>

            <a href="contact.html">
                CONTACT
            </a>

        </nav>


        <div class="header-icons">

            <button
                type="button"
                id="menu-btn"
                aria-label="Open navigation menu"
            >

                <i class="fas fa-bars"></i>

            </button>

        </div>


    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             GALLERY INTRO
        ================================================== -->

        <section class="gallery-intro">

            <div class="gallery-eyebrow">
                SZEPRED JOURNEYS
            </div>


            <h1>
                Memories Along the Way
            </h1>


            <p>
                Beautiful moments captured during the
                journeys and experiences we share with
                our guests.
            </p>

        </section>



        <!-- =================================================
             GALLERY
        ================================================== -->

        <section
            class="gallery-section"
            aria-label="Szepred photography gallery"
        >


            <div
                id="gallery-status"
                class="gallery-status"
                aria-live="polite"
            >
                Loading gallery...
            </div>


            <!--
                JavaScript automatically creates the
                photograph stack inside this container.
            -->

            <div
                id="gallery-grid"
                class="gallery-grid"
            ></div>


        </section>


    </main>



    <!-- =====================================================
         LIGHTBOX
    ====================================================== -->

    <div
        id="lightbox"
        class="lightbox"
        aria-hidden="true"
    >


        <button
            type="button"
            class="lightbox-close"
            id="lightbox-close"
            aria-label="Close image viewer"
        >

            <i class="fas fa-xmark"></i>

        </button>


        <button
            type="button"
            class="lightbox-prev"
            id="lightbox-prev"
            aria-label="Previous image"
        >

            <i class="fas fa-chevron-left"></i>

        </button>


        <div class="lightbox-content">


            <img
                id="lightbox-image"
                class="lightbox-image"
                src=""
                alt="Gallery image"
            >


            <div
                id="lightbox-title"
                class="lightbox-title"
            ></div>


        </div>


        <button
            type="button"
            class="lightbox-next"
            id="lightbox-next"
            aria-label="Next image"
        >

            <i class="fas fa-chevron-right"></i>

        </button>


        <div
            id="lightbox-counter"
            class="lightbox-counter"
        >
            1 / 1
        </div>


    </div>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer class="footer">

    <div class="footer-bottom">
        © 2026 Szepred. All Rights Reserved.
    </div>

</footer>


    <!-- =====================================================
         WHATSAPP
    ====================================================== -->

    <a
        href="https://wa.me/"
        class="whatsapp-float"
        aria-label="Contact Szepred on WhatsApp"
        target="_blank"
        rel="noopener"
    >

        <i class="fab fa-whatsapp"></i>

    </a>



    <!-- =====================================================
         GALLERY JAVASCRIPT
    ====================================================== -->

    <script
        src="gallery.js"
    ></script>


</body>

</html>
